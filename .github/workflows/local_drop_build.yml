                      cornerRadius = 64f
                      setStroke(2, Color.parseColor("#387DD3FC"))
                  }

                  val glassCard = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      background = glassCardBg
                      setPadding(64, 72, 64, 72)

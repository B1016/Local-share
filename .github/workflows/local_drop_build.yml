          cat << 'EOF' > app/src/main/java/com/localdrop/app/MainActivity.kt
          package com.localdrop.app

          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.text.format.Formatter
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.documentfile.provider.DocumentFile
          import fi.iki.elonen.NanoHTTPD
          import java.io.BufferedInputStream
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import java.net.URLDecoder
          import java.net.URLEncoder

          class MainActivity : AppCompatActivity() {

              private var server: LiquidLanServer? = null
              private var selectedFolder: DocumentFile? = null
              private lateinit var folderNameText: TextView
              private lateinit var statusPill: TextView
              private lateinit var urlBox: TextView
              private lateinit var toggleServerBtn: Button
              private val PORT = 8080

              private val folderPicker = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri: Uri? ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      )
                      selectedFolder = DocumentFile.fromTreeUri(this, uri)
                      folderNameText.text = selectedFolder?.name ?: "Selected Folder"
                      toggleServerBtn.isEnabled = true
                      toggleServerBtn.alpha = 1.0f
                      if (server != null) {
                          restartServer()
                      } else {
                          statusPill.text = "READY TO HOST"
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.parseColor("#050811")
                  window.navigationBarColor = Color.parseColor("#050811")

                  // Deep Liquid Gradient Backdrop

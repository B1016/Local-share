name: Build Local Drop APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android Project (Local Drop)
        run: |
          mkdir -p app/src/main/java/com/localdrop/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Local_Drop"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.localdrop.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.localdrop.app"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("androidx.documentfile:documentfile:1.0.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          # Glossy Black Background with Subtle Liquid Specular Sheen
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="0"
                          android:startY="0"
                          android:endX="108"
                          android:endY="108"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#1E2430"/>
                          <item android:offset="0.45" android:color="#090C10"/>
                          <item android:offset="1.0" android:color="#020305"/>
                      </gradient>
                  </aapt:attr>
              </path>
              <path android:pathData="M0,0 L108,0 L108,46 Q54,68 0,38 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="54"
                          android:startY="0"
                          android:endX="54"
                          android:endY="60"
                          android:type="linear">
                          <item android:offset="0.0" android:color="#2EFFFFFF"/>
                          <item android:offset="1.0" android:color="#00FFFFFF"/>
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          # Reversed Gradient Blue Hotspot + Interlocking Lighter Blue Gradient Wi-Fi Puzzle Icon

                  statusPill = TextView(this).apply {
                      text = "STANDBY • SELECT FOLDER"
                      textSize = 11f
                      letterSpacing = 0.14f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#7DD3FC"))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2238BDF8"))
                          cornerRadius = 999f
                          setStroke(1, Color.parseColor("#447DD3FC"))
                      }
                      setPadding(36, 14, 36, 14)
                  }

                  val title = TextView(this).apply {
                      text = "Local Drop"
                      textSize = 32f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 36, 0, 8)
                  }

                  val subtitle = TextView(this).apply {
                      text = "Minimal Liquid Glass LAN File Host
Original Quality • Unrestricted Speed"
                      textSize = 13f
                      setTextColor(Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 48)
                  }

                  // Inner Frosted Folder Box
                  val folderBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#18000000"))
                          cornerRadius = 36f
                          setStroke(1, Color.parseColor("#26FFFFFF"))
                      }
                      setPadding(40, 36, 40, 36)
                  }

                  val folderLabel = TextView(this).apply {
                      text = "SHARED FOLDER"
                      textSize = 10f
                      letterSpacing = 0.12f
                      setTextColor(Color.parseColor("#64748B"))
                      gravity = Gravity.CENTER
                  }

                  folderNameText = TextView(this).apply {
                      text = "None selected"
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#E2E8F0"))
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 0)
                  }

                  folderBox.addView(folderLabel)
                  folderBox.addView(folderNameText)

                  urlBox = TextView(this).apply {
                      text = ""
                      textSize = 17f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#38BDF8"))
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#1A0284C7"))
                          cornerRadius = 32f
                          setStroke(1, Color.parseColor("#4D38BDF8"))
                      }

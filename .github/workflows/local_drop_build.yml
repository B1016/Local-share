                      setTypeface(null, Typeface.BOLD)
                      isEnabled = false
                      alpha = 0.45f
                      setTextColor(Color.WHITE)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(
                              Color.parseColor("#0284C7"),
                              Color.parseColor("#2563EB"),
                              Color.parseColor("#38BDF8")
                          )
                      ).apply {
                          cornerRadius = 36f
                      }
                      setPadding(48, 34, 48, 34)
                      setOnClickListener { toggleServer() }
                  }

                  glassCard.addView(statusPill)
                  glassCard.addView(title)
                  glassCard.addView(subtitle)
                  glassCard.addView(folderBox)
                  glassCard.addView(spacer1)
                  glassCard.addView(urlBox)
                  glassCard.addView(pickBtn)
                  glassCard.addView(spacer2)
                  glassCard.addView(toggleServerBtn)

                  root.addView(glassCard)
                  setContentView(root)
              }

              private fun restartServer() {
                  server?.stop()
                  server = null
                  toggleServer()
              }

              private fun toggleServer() {
                  if (server == null) {
                      val folder = selectedFolder ?: return
                      server = LiquidLanServer(applicationContext, folder, PORT).apply {
                          start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                      }
                      val ip = getLocalIpAddress()
                      statusPill.text = "LIVE ON LAN • NO SPEED LIMIT"
                      urlBox.visibility = View.VISIBLE
                      urlBox.text = "Tap to copy browser link:
http://$ip:$PORT"
                      toggleServerBtn.text = "Stop Hosting"
                  } else {
                      server?.stop()
                      server = null
                      statusPill.text = "PAUSED"
                      urlBox.visibility = View.GONE
                      toggleServerBtn.text = "Start Local Drop"
                  }
              }

              private fun getLocalIpAddress(): String {
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          if (!intf.isUp || intf.isLoopback) continue
                          for (addr in intf.inetAddresses) {
                              if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                  val ip = addr.hostAddress ?: continue
                                  if (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")) {
                                      return ip
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return "127.0.0.1"
              }

              override fun onDestroy() {
                  super.onDestroy()
                  server?.stop()
              }
          }

          class LiquidLanServer(
              private val context: Context,
              private val rootFolder: DocumentFile,
              port: Int
          ) : NanoHTTPD(port) {

              // Strictly scopes access to inside the user-selected rootFolder only (prevents path traversal)
              private fun resolvePath(relativePath: String): DocumentFile? {
                  if (relativePath.isEmpty()) return rootFolder
                  var current: DocumentFile? = rootFolder
                  val parts = relativePath.split("/").filter { it.isNotEmpty() && it != "." && it != ".." }
                  for (part in parts) {
                      current = current?.findFile(part) ?: return null
                  }
                  return current
              }

              override fun serve(session: IHTTPSession): Response {
                  val uri = session.uri

                  if (uri.startsWith("/raw/")) {
                      val encodedPath = uri.removePrefix("/raw/")
                      val decodedPath = URLDecoder.decode(encodedPath, "UTF-8")
                      val targetFile = resolvePath(decodedPath)

                      if (targetFile != null && targetFile.isFile) {
                          val rawStream = context.contentResolver.openInputStream(targetFile.uri)
                              ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Cannot open file")
                          // 64KB buffer for full LAN hardware throughput and zero photo/video compression
                          val highSpeedStream = BufferedInputStream(rawStream, 65536)
                          val mime = targetFile.type ?: "application/octet-stream"
                          val length = targetFile.length()

                          val res = newFixedLengthResponse(Response.Status.OK, mime, highSpeedStream, length)
                          res.addHeader("Content-Disposition", "attachment; filename=\"${targetFile.name}\"")
                          res.addHeader("Accept-Ranges", "bytes")
                          res.addHeader("Cache-Control", "no-transform")
                          return res
                      }
                      return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "File not found")
                  }

                  val subPath = session.parameters["dir"]?.firstOrNull() ?: ""
                  val currentDir = resolvePath(subPath) ?: rootFolder
                  val items = currentDir.listFiles().sortedWith(compareBy({ !it.isDirectory }, { it.name?.lowercase() ?: "" }))

                  val html = buildString {
                      append("<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'>")
                      append("<meta name='viewport' content='width=device-width, initial-scale=1'>")
                      append("<title>Local Drop</title>")
                      append("<style>")
                      append("*{box-sizing:border-box;}")
                      append("body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f8fafc;background:radial-gradient(circle at 15% 15%,#0ea5e933 0%,transparent 45%),radial-gradient(circle at 85% 80%,#2563eb33 0%,transparent 50%),linear-gradient(135deg,#050811 0%,#0a1428 55%,#04070f 100%);padding:32px 18px;}")
                      append(".container{max-width:820px;margin:0 auto;}")
                      append(".glass-header{background:linear-gradient(135deg,rgba(255,255,255,0.10),rgba(255,255,255,0.03));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(125,211,252,0.22);border-radius:28px;padding:24px 28px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,0.45),inset 0 1px 1px rgba(255,255,255,0.2);}")
                      append(".brand{display:flex;align-items:center;gap:14px;}")
                      append(".logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#2563eb);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;box-shadow:0 8px 20px rgba(37,99,235,0.4);}")
                      append("h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-0.02em;background:linear-gradient(90deg,#ffffff,#7dd3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}")
                      append(".sub{font-size:0.8rem;color:#94a3b8;margin-top:2px;}")
                      append(".pill{background:rgba(56,189,248,0.12);border:1px solid rgba(125,211,252,0.3);color:#7dd3fc;padding:6px 14px;border-radius:999px;font-size:0.75rem;font-weight:600;letter-spacing:0.04em;}")
                      append(".search-wrap{margin-bottom:20px;}")
                      append(".search{width:100%;padding:15px 22px;border-radius:20px;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font-size:0.95rem;outline:none;transition:border 0.2s,background 0.2s;}")
                      append(".search:focus{border-color:#38bdf8;background:rgba(255,255,255,0.09);}")
                      append(".item{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);margin:12px 0;padding:16px 22px;border-radius:22px;transition:transform 0.18s ease,border-color 0.18s ease,box-shadow 0.18s ease;box-shadow:0 8px 28px rgba(0,0,0,0.28),inset 0 1px 0 rgba(255,255,255,0.15);}")
                      append(".item:hover{transform:translateY(-2px);border-color:rgba(125,211,252,0.4);box-shadow:0 12px 32px rgba(2,132,199,0.22);}")
                      append(".info{overflow:hidden;margin-right:16px;}")
                      append(".name{font-weight:600;font-size:0.98rem;color:#f1f5f9;word-break:break-all;}")
                      append(".meta{font-size:0.78rem;color:#94a3b8;margin-top:5px;}")
                      append(".btn{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;text-decoration:none;padding:10px 20px;border-radius:14px;font-weight:600;font-size:0.86rem;white-space:nowrap;box-shadow:0 6px 18px rgba(37,99,235,0.35);transition:opacity 0.15s;}")
                      append(".btn:hover{opacity:0.92;}")
                      append(".btn-folder{background:rgba(255,255,255,0.08);border:1px solid rgba(125,211,252,0.3);color:#7dd3fc;box-shadow:none;}")
                      append(".empty{text-align:center;padding:64px 20px;color:#94a3b8;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.12);border-radius:24px;}")
                      append("</style></head><body><div class='container'>")

                      append("<div class='glass-header'>")
                      append("<div class='brand'><div class='logo'>💧</div><div><h1>Local Drop</h1><div class='sub'>Folder: ${rootFolder.name ?: "Shared"}</div></div></div>")
                      append("<span class='pill'>ORIGINAL QUALITY • FULL LAN SPEED</span>")
                      append("</div>")

                      append("<div class='search-wrap'><input class='search' type='text' id='q' placeholder='Filter files in this folder...' oninput='filterFiles()'></div>")

                      if (subPath.isNotEmpty()) {
                          val parentPath = subPath.substringBeforeLast("/", "")
                          val encodedParent = URLEncoder.encode(parentPath, "UTF-8")
                          append("<div class='item'><div class='info'><div class='name'>⬅ Back</div><div class='meta'>/$subPath</div></div>")
                          append("<a class='btn btn-folder' href='/?dir=$encodedParent'>Up Folder</a></div>")
                      }

                      if (items.isEmpty()) {
                          append("<div class='empty'>No files in this folder.</div>")
                      } else {
                          append("<div id='list'>")
                          for (item in items) {
                              val name = item.name ?: continue
                              val itemRelPath = if (subPath.isEmpty()) name else "$subPath/$name"
                              val encodedRelPath = URLEncoder.encode(itemRelPath, "UTF-8").replace("+", "%20")

                              if (item.isDirectory) {
                                  append("<div class='item file-row' data-name='${name.lowercase()}'>")
                                  append("<div class='info'><div class='name'>📁 $name</div><div class='meta'>Subfolder</div></div>")
                                  append("<a class='btn btn-folder' href='/?dir=$encodedRelPath'>Open</a>")
                                  append("</div>")
                              } else {
                                  val size = Formatter.formatFileSize(context, item.length())
                                  append("<div class='item file-row' data-name='${name.lowercase()}'>")
                                  append("<div class='info'><div class='name'>$name</div><div class='meta'>$size • Uncompressed Raw Stream</div></div>")
                                  append("<a class='btn' href='/raw/$encodedRelPath' download>Download</a>")
                                  append("</div>")
                              }
                          }
                          append("</div>")
                      }

                      append("<script>")
                      append("function filterFiles(){var q=document.getElementById('q').value.toLowerCase();var rows=document.querySelectorAll('.file-row');rows.forEach(function(r){r.style.display=r.getAttribute('data-name').indexOf(q)>-1?'flex':'none';});}")
                      append("</script></div></body></html>")
                  }

                  return newFixedLengthResponse(Response.Status.OK, "text/html", html)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: cp app/build/outputs/apk/debug/app-debug.apk Local_Drop.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Local-Drop-APK
          path: Local_Drop.apk

      - name: Publish Direct Download Link in GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Local Drop v2.0.${{ github.run_number }}"
          body: "Direct APK download for **Local Drop** (Liquid Glass UI, Reversed Gradient Blue Hotspot + Lighter Blue Wi-Fi Puzzle Icon, uncompressed original files, unrestricted LAN speed)."
          files: Local_Drop.apk

name: Build LOCAL FILE APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android Project (LOCAL FILE)
        run: |
          mkdir -p app/src/main/java/com/localfile/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LOCAL_FILE"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.localfile.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.localfile.app"
                  minSdk = 21
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("org.nanohttpd:nanohttpd:2.3.1")
              implementation("androidx.documentfile:documentfile:1.0.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          # AirDrop-style concentric radar waves icon background & foreground
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer AirDrop Radar Ring -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#007AFF"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:pathData="M 32,76 A 31,31 0 1,1 76,76" />
              <!-- Middle AirDrop Radar Ring -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#007AFF"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:pathData="M 39,69 A 21,21 0 1,1 69,69" />
              <!-- Inner AirDrop Radar Ring -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#007AFF"
                  android:strokeWidth="4.5"
                  android:strokeLineCap="round"
                  android:pathData="M 46,62 A 11,11 0 1,1 62,62" />
              <!-- Center Broadcast Node / Wedge -->
              <path
                  android:fillColor="#007AFF"
                  android:pathData="M54,50 a4,4 0 1,0 0,8 a4,4 0 1,0 0,-8 z" />
              <path
                  android:fillColor="#007AFF"
                  android:pathData="M54,60 L42,80 L66,80 Z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="LOCAL FILE"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/localfile/app/MainActivity.kt
          package com.localfile.app

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.text.format.Formatter
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.documentfile.provider.DocumentFile
          import fi.iki.elonen.NanoHTTPD
          import java.io.BufferedInputStream
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import java.net.URLDecoder
          import java.net.URLEncoder

          class MainActivity : AppCompatActivity() {

              private var server: RawLanServer? = null
              private var selectedFolder: DocumentFile? = null
              private lateinit var statusText: TextView
              private lateinit var urlText: TextView
              private lateinit var toggleServerBtn: Button
              private val PORT = 8080

              private val folderPicker = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri: Uri? ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      )
                      selectedFolder = DocumentFile.fromTreeUri(this, uri)
                      statusText.text = "Selected Folder:\n${selectedFolder?.name}"
                      toggleServerBtn.isEnabled = true
                      if (server != null) {
                          restartServer()
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0D1117"))
                      setPadding(64, 64, 64, 64)
                  }

                  val title = TextView(this).apply {
                      text = "LOCAL FILE"
                      textSize = 28f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#007AFF"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }

                  val subtitle = TextView(this).apply {
                      text = "Uncompressed • Full LAN Speed"
                      textSize = 14f
                      setTextColor(Color.parseColor("#8B949E"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 64)
                  }

                  statusText = TextView(this).apply {
                      text = "No folder selected"
                      textSize = 16f
                      setTextColor(Color.parseColor("#C9D1D9"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }

                  urlText = TextView(this).apply {
                      text = ""
                      textSize = 20f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.parseColor("#58A6FF"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 64)
                  }

                  val pickBtn = Button(this).apply {
                      text = "1. Select Folder to Share"
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#21262D"))
                          cornerRadius = 24f
                          setStroke(2, Color.parseColor("#30363D"))
                      }
                      setPadding(48, 36, 48, 36)
                      setOnClickListener { folderPicker.launch(null) }
                  }

                  val spacer = TextView(this).apply { height = 36 }

                  toggleServerBtn = Button(this).apply {
                      text = "2. Start AirDrop LAN Server"
                      isEnabled = false
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#007AFF"))
                          cornerRadius = 24f
                      }
                      setPadding(48, 36, 48, 36)
                      setOnClickListener { toggleServer() }
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(statusText)
                  root.addView(urlText)
                  root.addView(pickBtn)
                  root.addView(spacer)
                  root.addView(toggleServerBtn)

                  setContentView(root)
              }

              private fun restartServer() {
                  server?.stop()
                  server = null
                  toggleServer()
              }

              private fun toggleServer() {
                  if (server == null) {
                      val folder = selectedFolder ?: return
                      server = RawLanServer(applicationContext, folder, PORT).apply {
                          start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                      }
                      val ip = getLocalIpAddress()
                      statusText.text = "Sharing Folder: ${folder.name}\nOpen this URL on any browser on your Wi-Fi / Hotspot:"
                      urlText.text = "http://$ip:$PORT"
                      toggleServerBtn.text = "Stop LAN Server"
                  } else {
                      server?.stop()
                      server = null
                      statusText.text = "Server Stopped\nSelected Folder: ${selectedFolder?.name}"
                      urlText.text = ""
                      toggleServerBtn.text = "2. Start AirDrop LAN Server"
                  }
              }

              private fun getLocalIpAddress(): String {
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          if (!intf.isUp || intf.isLoopback) continue
                          for (addr in intf.inetAddresses) {
                              if (addr is Inet4Address && !addr.isLoopbackAddress) {
                                  val ip = addr.hostAddress ?: continue
                                  if (ip.startsWith("192.168.") || ip.startsWith("10.") || ip.startsWith("172.")) {
                                      return ip
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return "127.0.0.1"
              }

              override fun onDestroy() {
                  super.onDestroy()
                  server?.stop()
              }
          }

          class RawLanServer(
              private val context: Context,
              private val rootFolder: DocumentFile,
              port: Int
          ) : NanoHTTPD(port) {

              private fun resolvePath(relativePath: String): DocumentFile? {
                  if (relativePath.isEmpty()) return rootFolder
                  var current: DocumentFile? = rootFolder
                  val parts = relativePath.split("/").filter { it.isNotEmpty() }
                  for (part in parts) {
                      current = current?.findFile(part) ?: return null
                  }
                  return current
              }

              override fun serve(session: IHTTPSession): Response {
                  val uri = session.uri

                  // Direct raw binary stream with 64KB buffer — zero compression, no speed cap
                  if (uri.startsWith("/raw/")) {
                      val encodedPath = uri.removePrefix("/raw/")
                      val decodedPath = URLDecoder.decode(encodedPath, "UTF-8")
                      val targetFile = resolvePath(decodedPath)

                      if (targetFile != null && targetFile.isFile) {
                          val rawStream = context.contentResolver.openInputStream(targetFile.uri)
                              ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, MIME_PLAINTEXT, "Cannot open file")
                          val highSpeedStream = BufferedInputStream(rawStream, 65536)
                          val mime = targetFile.type ?: "application/octet-stream"
                          val length = targetFile.length()

                          val res = newFixedLengthResponse(Response.Status.OK, mime, highSpeedStream, length)
                          res.addHeader("Content-Disposition", "attachment; filename=\"${targetFile.name}\"")
                          res.addHeader("Accept-Ranges", "bytes")
                          res.addHeader("Cache-Control", "no-transform")
                          return res
                      }
                      return newFixedLengthResponse(Response.Status.NOT_FOUND, MIME_PLAINTEXT, "File not found")
                  }

                  val subPath = session.parameters["dir"]?.firstOrNull() ?: ""
                  val currentDir = resolvePath(subPath) ?: rootFolder
                  val items = currentDir.listFiles().sortedWith(compareBy({ !it.isDirectory }, { it.name?.lowercase() ?: "" }))

                  val html = buildString {
                      append("<!DOCTYPE html><html><head><meta charset='utf-8'>")
                      append("<meta name='viewport' content='width=device-width, initial-scale=1'>")
                      append("<title>LOCAL FILE</title>")
                      append("<style>")
                      append("body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;max-width:860px;margin:auto;}")
                      append(".header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d;padding-bottom:16px;margin-bottom:20px;}")
                      append("h1{color:#007AFF;margin:0;font-size:1.5rem;}")
                      append(".badge{background:#1f2937;color:#58a6ff;padding:4px 10px;border-radius:999px;font-size:0.8rem;}")
                      append(".item{display:flex;justify-content:space-between;align-items:center;background:#161b22;border:1px solid #30363d;margin:10px 0;padding:14px 18px;border-radius:12px;}")
                      append(".info{overflow:hidden;margin-right:16px;}")
                      append(".name{font-weight:600;color:#f0f6fc;word-break:break-all;text-decoration:none;}")
                      append(".meta{font-size:0.82rem;color:#8b949e;margin-top:4px;}")
                      append(".btn{background:#007AFF;color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:600;font-size:0.9rem;white-space:nowrap;}")
                      append(".btn-folder{background:#21262d;border:1px solid #30363d;color:#58a6ff;}")
                      append("</style></head><body>")
                      append("<div class='header'><h1>📡 LOCAL FILE</h1><span class='badge'>Original Quality • Full Speed</span></div>")

                      if (subPath.isNotEmpty()) {
                          val parentPath = subPath.substringBeforeLast("/", "")
                          val encodedParent = URLEncoder.encode(parentPath, "UTF-8")
                          append("<div class='item'><div class='info'><div class='name'>⬅️ Back</div><div class='meta'>/$subPath</div></div>")
                          append("<a class='btn btn-folder' href='/?dir=$encodedParent'>Up One Folder</a></div>")
                      }

                      if (items.isEmpty()) {
                          append("<p style='color:#8b949e;text-align:center;padding:40px 0;'>This folder is empty.</p>")
                      } else {
                          for (item in items) {
                              val name = item.name ?: continue
                              val itemRelPath = if (subPath.isEmpty()) name else "$subPath/$name"
                              val encodedRelPath = URLEncoder.encode(itemRelPath, "UTF-8").replace("+", "%20")

                              if (item.isDirectory) {
                                  append("<div class='item'>")
                                  append("<div class='info'><div class='name'>📁 $name</div><div class='meta'>Folder</div></div>")
                                  append("<a class='btn btn-folder' href='/?dir=$encodedRelPath'>Open</a>")
                                  append("</div>")
                              } else {
                                  val size = Formatter.formatFileSize(context, item.length())
                                  append("<div class='item'>")
                                  append("<div class='info'><div class='name'>📄 $name</div><div class='meta'>$size • Original Raw File</div></div>")
                                  append("<a class='btn' href='/raw/$encodedRelPath' download>Download</a>")
                                  append("</div>")
                              }
                          }
                      }
                      append("</body></html>")
                  }

                  return newFixedLengthResponse(Response.Status.OK, "text/html", html)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: cp app/build/outputs/apk/debug/app-debug.apk LOCAL_FILE.apk

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LOCAL-FILE-APK
          path: LOCAL_FILE.apk

      - name: Publish Direct Download Link in GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "LOCAL FILE v1.0.${{ github.run_number }}"
          body: "Direct APK download for **LOCAL FILE** (AirDrop icon, uncompressed original files, unrestricted LAN speed)."
          files: LOCAL_FILE.apk

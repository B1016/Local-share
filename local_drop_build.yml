          data class SharedFileItem(
              val name: String,
              val relativePath: String,
              val sizeBytes: Long,
              val lastModified: Long,
              val isDirectory: Boolean,
              val mimeType: String,
              val uri: Uri
          )

          class MainActivity : ComponentActivity() {
              private var lanServer: LocalDropHttpServer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()

                  val prefs = getSharedPreferences("local_drop_prefs", Context.MODE_PRIVATE)
                  val savedUriStr = prefs.getString("selected_folder_uri", null)
                  val initialUri = savedUriStr?.let { Uri.parse(it) }

                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = Color(0xFF050811),
                              surface = Color(0xFF0D1326),
                              primary = Color(0xFF38BDF8),
                              secondary = Color(0xFF2563EB)
                          )
                      ) {
                          LocalDropScreen(
                              initialFolderUri = initialUri,
                              onSaveFolderUri = { uri ->
                                  prefs.edit().putString("selected_folder_uri", uri.toString()).apply()
                              },
                              onStartServer = { folderUri, port, onDownloadCountIncrement ->
                                  lanServer?.stop()
                                  val server = LocalDropHttpServer(
                                      context = applicationContext,
                                      rootFolderUri = folderUri,
                                      port = port,
                                      onFileDownloaded = onDownloadCountIncrement
                                  )
                                  server.start(NanoHTTPD.SOCKET_READ_TIMEOUT, false)
                                  lanServer = server
                              },
                              onStopServer = {
                                  lanServer?.stop()
                                  lanServer = null
                              }
                          )
                      }
                  }
              }

              override fun onDestroy() {
                  lanServer?.stop()
                  super.onDestroy()
              }
          }

          @Composable
          fun LocalDropLogoIcon(modifier: Modifier = Modifier) {
              Canvas(modifier = modifier) {
                  val w = size.width
                  val h = size.height
                  val center = Offset(w / 2f, h / 2f)

                  // Glossy black squircle background
                  drawRoundRect(
                      brush = Brush.linearGradient(
                          colors = listOf(Color(0xFF131B2E), Color(0xFF04060A), Color(0xFF000000)),
                          start = Offset(0f, 0f),
                          end = Offset(w, h)
                      ),
                      cornerRadius = androidx.compose.ui.geometry.CornerRadius(w * 0.24f, h * 0.24f)
                  )

                  // Subtle liquid glass top highlight
                  drawRoundRect(
                      brush = Brush.verticalGradient(
                          colors = listOf(Color.White.copy(alpha = 0.16f), Color.Transparent),
                          startY = 0f,
                          endY = h * 0.5f
                      ),
                      cornerRadius = androidx.compose.ui.geometry.CornerRadius(w * 0.24f, h * 0.24f)
                  )

                  val deepBlueBrush = Brush.linearGradient(
                      colors = listOf(Color(0xFF1E3A8A), Color(0xFF2563EB), Color(0xFF3B82F6)),
                      start = Offset(w * 0.15f, h * 0.75f),
                      end = Offset(w * 0.75f, h * 0.15f)
                  )

                  val lightBlueBrush = Brush.linearGradient(
                      colors = listOf(Color(0xFF0284C7), Color(0xFF38BDF8), Color(0xFFA5F3FC)),
                      start = Offset(w * 0.35f, h * 0.85f),
                      end = Offset(w * 0.85f, h * 0.35f)
                  )

                  val strokeW = w * 0.065f

                  // Reversed Hotspot Outer & Middle Arcs (Top-Left side, opening toward Bottom-Right)
                  drawArc(
                      brush = deepBlueBrush,
                      startAngle = 140f,
                      sweepAngle = 170f,
                      useCenter = false,
                      topLeft = Offset(w * 0.18f, h * 0.18f),
                      size = Size(w * 0.64f, h * 0.64f),
                      style = Stroke(width = strokeW, cap = StrokeCap.Round)
                  )
                  drawArc(
                      brush = deepBlueBrush,
                      startAngle = 140f,
                      sweepAngle = 170f,
                      useCenter = false,
                      topLeft = Offset(w * 0.28f, h * 0.28f),
                      size = Size(w * 0.44f, h * 0.44f),
                      style = Stroke(width = strokeW, cap = StrokeCap.Round)
                  )

                  // Lighter Blue Wi-Fi Outer & Middle Arcs in the empty Bottom-Right space
                  drawArc(
                      brush = lightBlueBrush,
                      startAngle = -40f,
                      sweepAngle = 170f,
                      useCenter = false,
                      topLeft = Offset(w * 0.18f, h * 0.18f),
                      size = Size(w * 0.64f, h * 0.64f),
                      style = Stroke(width = strokeW, cap = StrokeCap.Round)
                  )
                  drawArc(
                      brush = lightBlueBrush,
                      startAngle = -40f,
                      sweepAngle = 170f,
                      useCenter = false,
                      topLeft = Offset(w * 0.28f, h * 0.28f),
                      size = Size(w * 0.44f, h * 0.44f),
                      style = Stroke(width = strokeW, cap = StrokeCap.Round)
                  )

                  // Center Interlocking Puzzle Nodes (Hotspot tab into Wi-Fi socket)
                  drawArc(
                      brush = deepBlueBrush,
                      startAngle = 135f,
                      sweepAngle = 180f,
                      useCenter = true,
                      topLeft = Offset(w * 0.39f, h * 0.39f),
                      size = Size(w * 0.22f, h * 0.22f)
                  )
                  drawArc(
                      brush = lightBlueBrush,
                      startAngle = -45f,
                      sweepAngle = 180f,
                      useCenter = true,
                      topLeft = Offset(w * 0.41f, h * 0.41f),
                      size = Size(w * 0.22f, h * 0.22f)
                  )
                  // Puzzle connector knob protruding from reversed hotspot into Wi-Fi core
                  drawCircle(
                      brush = deepBlueBrush,
                      radius = w * 0.052f,
                      center = Offset(center.x + w * 0.03f, center.y + h * 0.03f)
                  )
              }
          }


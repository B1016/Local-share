              private fun escapeHtml(text: String): String {
                  return buildString(text.length) {
                      for (ch in text) {
                          when (ch) {
                              '&' -> append("&amp;")
                              '<' -> append("&lt;")
                              '>' -> append("&gt;")
                              '"' -> append("&quot;")
                              '\'' -> append("&#39;")
                              else -> append(ch)
                          }
                      }
                  }
              }
          }

          fun getDeviceLanIpAddress(): String {
              try {
                  val interfaces = Collections.list(NetworkInterface.getNetworkInterfaces())
                  var fallbackIp: String? = null
                  for (intf in interfaces) {
                      if (!intf.isUp || intf.isLoopback) continue
                      val name = intf.name.lowercase(Locale.getDefault())
                      for (addr in Collections.list(intf.inetAddresses)) {
                          if (!addr.isLoopbackAddress && addr is Inet4Address) {
                              val ip = addr.hostAddress ?: continue
                              if (name.startsWith("wlan") || name.startsWith("ap") || name.startsWith("swlan") || name.startsWith("rndis")) {
                                  return ip
                              }
                              if (fallbackIp == null) {
                                  fallbackIp = ip
                              }
                          }
                      }
                  }
                  if (fallbackIp != null) return fallbackIp
              } catch (_: Exception) {}
              return "192.168.43.1"
          }

          fun formatFileSize(sizeBytes: Long): String {
              if (sizeBytes <= 0) return "0 B"
              val units = arrayOf("B", "KB", "MB", "GB", "TB")
              val digitGroups = (log10(sizeBytes.toDouble()) / log10(1024.0)).toInt().coerceIn(0, units.lastIndex)
              return DecimalFormat("#,##0.#").format(sizeBytes / 1024.0.pow(digitGroups.toDouble())) + " " + units[digitGroups]
          }

          fun guessMimeType(fileName: String): String {
              val ext = fileName.substringAfterLast('.', "").lowercase(Locale.getDefault())
              if (ext.isNotEmpty()) {
                  MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext)?.let { return it }
              }
              return "application/octet-stream"
          }

          fun generateQrCodeBitmap(content: String, sizePx: Int): Bitmap? {
              return try {
                  val matrix = QRCodeWriter().encode(content, BarcodeFormat.QR_CODE, sizePx, sizePx)
                  val bmp = Bitmap.createBitmap(sizePx, sizePx, Bitmap.Config.RGB_565)
                  for (x in 0 until sizePx) {
                      for (y in 0 until sizePx) {
                          bmp.setPixel(x, y, if (matrix.get(x, y)) android.graphics.Color.BLACK else android.graphics.Color.WHITE)
                      }
                  }
                  bmp
              } catch (_: Exception) {
                  null
              }
          }

              fun refreshFolderContents(uri: Uri?) {
                  if (uri == null) return
                  isScanning = true
                  scope.launch(Dispatchers.IO) {
                      val docFolder = DocumentFile.fromTreeUri(context, uri)
                      val resolvedName = docFolder?.name ?: "Selected Folder"
                      val items = mutableListOf<SharedFileItem>()
                      if (docFolder != null && docFolder.exists()) {
                          docFolder.listFiles().forEach { file ->
                              val fName = file.name ?: "Unnamed"
                              items.add(
                                  SharedFileItem(
                                      name = fName,
                                      relativePath = fName,
                                      sizeBytes = file.length(),
                                      lastModified = file.lastModified(),
                                      isDirectory = file.isDirectory,
                                      mimeType = file.type ?: guessMimeType(fName),
                                      uri = file.uri
                                  )
                              )
                          }
                          items.sortWith(compareBy({ !it.isDirectory }, { it.name.lowercase(Locale.getDefault()) }))
                      }
                      withContext(Dispatchers.Main) {
                          folderName = resolvedName
                          sharedFiles.clear()
                          sharedFiles.addAll(items)
                          localIpAddress = getDeviceLanIpAddress()
                          isScanning = false
                      }
                  }

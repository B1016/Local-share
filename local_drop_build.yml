        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Local Drop v1.0 (Build #${{ github.run_number }})"
          body: "Automated build of **Local Drop** LAN file hosting Android app with Liquid Glass UI, scoped single-folder browser access, and custom puzzle-connected reversed hotspot + Wi-Fi icon."

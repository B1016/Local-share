          class LocalDropHttpServer(
              private val context: Context,
              private val rootFolderUri: Uri,
              port: Int,
              private val onFileDownloaded: () -> Unit
          ) : NanoHTTPD(port) {

              override fun serve(session: IHTTPSession): Response {
                  val uriPath = session.uri ?: "/"
                  val params = session.parameters

                  return try {
                      when {
                          uriPath == "/download" -> {
                              val relPath = params["path"]?.firstOrNull() ?: ""
                              serveScopedDownload(relPath)
                          }
                          else -> {
                              val subDir = params["dir"]?.firstOrNull() ?: ""
                              serveLiquidGlassWebPortal(subDir)
                          }
                      }
                  } catch (e: Exception) {
                      newFixedLengthResponse(
                          Response.Status.INTERNAL_ERROR,
                          "text/plain",
                          "Server Error: ${e.localizedMessage}"
                      )
                  }
              }

              private fun resolveRelativeDocument(relativePath: String): DocumentFile? {
                  val rootDoc = DocumentFile.fromTreeUri(context, rootFolderUri) ?: return null
                  val cleaned = relativePath.trim('/').replace("\\", "/")
                  if (cleaned.isEmpty()) return rootDoc
                  val segments = cleaned.split("/").filter { it.isNotEmpty() && it != "." && it != ".." }
                  var current: DocumentFile = rootDoc
                  for (seg in segments) {
                      val next = current.findFile(seg) ?: return null
                      current = next
                  }
                  return current
              }

              private fun serveScopedDownload(relativePath: String): Response {
                  val decodedPath = URLDecoder.decode(relativePath, "UTF-8")
                  val targetFile = resolveRelativeDocument(decodedPath)
                  if (targetFile == null || !targetFile.exists() || targetFile.isDirectory) {
                      return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "File not found in selected folder.")
                  }

                  val rawInputStream = context.contentResolver.openInputStream(targetFile.uri)
                      ?: return newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Unable to open file stream.")

                  val bufferedStream: InputStream = object : FilterInputStream(rawInputStream) {
                      override fun read(b: ByteArray, off: Int, len: Int): Int {
                          return super.read(b, off, len.coerceAtMost(65536))
                      }
                  }

                  val fileName = targetFile.name ?: "download.bin"
                  val mime = targetFile.type ?: guessMimeType(fileName)
                  val fileLength = targetFile.length()

                  onFileDownloaded()

                  val response = if (fileLength >= 0L) {
                      newFixedLengthResponse(Response.Status.OK, mime, bufferedStream, fileLength)
                  } else {
                      newChunkedResponse(Response.Status.OK, mime, bufferedStream)
                  }

                  val encodedFileName = URLEncoder.encode(fileName, "UTF-8").replace("+", "%20")
                  response.addHeader(
                      "Content-Disposition",
                      "attachment; filename=\"${fileName.replace("\"", "")}\"; filename*=UTF-8''$encodedFileName"
                  )
                  response.addHeader("Accept-Ranges", "bytes")
                  response.addHeader("Cache-Control", "no-store")
                  return response
              }

              private fun serveLiquidGlassWebPortal(subDir: String): Response {
                  val cleanedDir = subDir.trim('/').replace("\\", "/")
                  val currentDoc = resolveRelativeDocument(cleanedDir)
                      ?: return newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Folder not found.")

                  val rootDoc = DocumentFile.fromTreeUri(context, rootFolderUri)
                  val rootTitle = rootDoc?.name ?: "Shared Folder"

                  val children = currentDoc.listFiles().toList().sortedWith(
                      compareBy({ !it.isDirectory }, { (it.name ?: "").lowercase(Locale.getDefault()) })
                  )

                  val rowsBuilder = StringBuilder()
                  if (cleanedDir.isNotEmpty()) {
                      val parentDir = cleanedDir.substringBeforeLast('/', "")
                      val parentUrl = if (parentDir.isEmpty()) "/" else "/?dir=" + URLEncoder.encode(parentDir, "UTF-8")
                      rowsBuilder.append(
                          """
                          <a class="file-row folder-row" href="$parentUrl">
                              <div class="file-left">
                                  <div class="icon-badge folder-badge">&#8592;</div>
                                  <div class="file-meta">
                                      <div class="file-name">.. (Parent Folder)</div>
                                      <div class="file-sub">Return to previous directory</div>
                                  </div>
                              </div>
                              <span class="action-pill">Back</span>
                          </a>
                          """.trimIndent()
                      )
                  }

                  for (file in children) {
                      val name = file.name ?: "Unnamed"
                      val safeName = escapeHtml(name)
                      val relPath = if (cleanedDir.isEmpty()) name else "$cleanedDir/$name"
                      val encodedRel = URLEncoder.encode(relPath, "UTF-8")

                      if (file.isDirectory) {
                          rowsBuilder.append(
                              """
                              <a class="file-row folder-row" href="/?dir=$encodedRel" data-name="${safeName.lowercase(Locale.getDefault())}">
                                  <div class="file-left">
                                      <div class="icon-badge folder-badge">
                                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                                      </div>
                                      <div class="file-meta">
                                          <div class="file-name">$safeName</div>
                                          <div class="file-sub">Folder</div>
                                      </div>
                                  </div>
                                  <span class="action-pill">Open</span>
                              </a>
                              """.trimIndent()
                          )
                      } else {
                          val sizeLabel = formatFileSize(file.length())
                          rowsBuilder.append(
                              """
                              <div class="file-row" data-name="${safeName.lowercase(Locale.getDefault())}">
                                  <div class="file-left">
                                      <div class="icon-badge file-badge">

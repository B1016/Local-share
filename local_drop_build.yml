          @Composable
          fun LocalDropScreen(
              initialFolderUri: Uri?,
              onSaveFolderUri: (Uri) -> Unit,
              onStartServer: (Uri, Int, () -> Unit) -> Unit,
              onStopServer: () -> Unit
          ) {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val serverPort = 8080

